[versions]
agp = "9.4.1"
kotlin = "2.4.21"
junit = "4.13.2"
activityCompose = "1.13.0"
datastorePreferences = "1.2.1"
coroutinesAndroid = "1.11.0"
playReview = "2.0.2"
playAppUpdate = "2.1.0"

[libraries]
junit = { group = "junit", name = "junit", version.ref = "junit" }
androidx-activity = { group = "androidx.activity", name = "activity", version.ref = "activityCompose" }
androidx-datastore-preferences = { group = "androidx.datastore", name = "datastore-preferences", version.ref = "datastorePreferences" }
kotlinx-coroutines-android = { group = "org.jetbrains.kotlinx", name = "kotlinx-coroutines-android", version.ref = "coroutinesAndroid" }
kotlinx-coroutines-test = { group = "org.jetbrains.kotlinx", name = "kotlinx-coroutines-test", version.ref = "coroutinesAndroid" }
play-review = { group = "com.google.android.play", name = "review", version.ref = "playReview" }
play-app-update = { group = "com.google.android.play", name = "app-update", version.ref = "playAppUpdate" }

[plugins]
android-library = { id = "com.android.library", version.ref = "agp" }
kotlin-android = { id = "org.jetbrains.kotlin.android", version.ref = "kotlin" }
